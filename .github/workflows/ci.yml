name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholder values only — nothing here connects to a real database or
    # GitHub OAuth app. They exist so prisma.config.ts, Auth.js and
    # `next build` find the variables they expect. DATABASE_URL must be set
    # before `npm ci` because the postinstall script runs `prisma generate`.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-used-for-real-sessions
      AUTH_GITHUB_ID: ci-placeholder-github-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps and next-env.d.ts are generated by Next into
      # .next/types (gitignored), so generate them before running tsc.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', '*.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # TODO(#9): add unit and end-to-end tests here once Vitest and Playwright
      # are set up. Expected shape:
      #
      # - name: Unit tests
      #   run: npm run test -- --run
      #
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      #
      # - name: E2E tests
      #   run: npm run test:e2e
