name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway database for integration and e2e tests. It only exists for
    # this job, so tests never touch Neon.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholder values only — nothing here connects to a real database or
    # GitHub OAuth app. They exist so prisma.config.ts, Auth.js and
    # `next build` find the variables they expect. DATABASE_URL must be set
    # before `npm ci` because the postinstall script runs `prisma generate`.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-auth-secret-not-used-for-real-sessions
      AUTH_GITHUB_ID: ci-placeholder-github-id
      AUTH_GITHUB_SECRET: ci-placeholder-github-secret
      NEXT_TELEMETRY_DISABLED: 1
      # Used only by the test steps (see tests/test-db.mjs).
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tracker_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # LayoutProps/PageProps and next-env.d.ts are generated by Next into
      # .next/types (gitignored), so generate them before running tsc.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', '*.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Apply migrations to the test database
        run: npm run test:db:migrate

      - name: Integration tests (data isolation)
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
